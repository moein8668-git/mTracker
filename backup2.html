<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>mTracker - سیستم استمرار (SD Method)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='bold' font-family='sans-serif' fill='white' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#f8f9fb;
  --ink:#181b27; --muted:#667085; --line:#e6e8ef;
  --accent:#4f46e5; --accent-soft:#eef0fe;
  --ok:#0a8a5f; --ok-soft:#e4f5ee;
  --warn:#b45309; --warn-soft:#fdf3e1;
  --bad:#dc2626; --bad-soft:#fdeaea;
  --track:#e9ebf2; --bar-zero:#e3e6ee; --muted-soft:#eef0f4;
  --topbar:rgba(255,255,255,.9);
  --line-mean:rgba(79,70,229,.5); --line-target:rgba(10,138,95,.65);
  --toast-bg:#1c2030;
  --radius:14px; --radius-s:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
}
html[data-theme="dark"]{
  --bg:#13151b; --surface:#1b1e26; --surface2:#22262f;
  --ink:#e9ebf1; --muted:#97a0b2; --line:#2b303c;
  --accent:#818cf8; --accent-soft:rgba(129,140,248,.15);
  --ok:#3ecf9a; --ok-soft:rgba(62,207,154,.14);
  --warn:#e8b04b; --warn-soft:rgba(232,176,75,.14);
  --bad:#f47c7c; --bad-soft:rgba(244,124,124,.15);
  --track:#2c313d; --bar-zero:#2f3542; --muted-soft:#262b37;
  --topbar:rgba(19,21,27,.85);
  --line-mean:rgba(129,140,248,.55); --line-target:rgba(62,207,154,.6);
  --toast-bg:#2e3547;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.25);
}
html[data-theme="dark"] .bar,
html[data-theme="dark"] .linechart path,
html[data-theme="dark"] .linechart circle{filter:brightness(1.35)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Vazirmatn,'Segoe UI',Tahoma,sans-serif;
  background:var(--bg); color:var(--ink);
  line-height:1.75; font-size:15.5px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 90px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem}
.brand .logo{width:31px;height:31px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.95rem;font-weight:800;padding-bottom:3px}
.brand small{font-weight:500;font-size:.72rem;color:var(--muted);display:block;line-height:1.2}
.tabs{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-inline-start:auto;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;font-size:.86rem;padding:6px 13px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.active{background:var(--accent);color:#fff}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:var(--radius-s);cursor:pointer;font-weight:600;font-size:.88rem;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{padding:6px 12px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:default}
.badge{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 12px;border-radius:999px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.mutedb{background:var(--muted-soft);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--task,var(--accent));flex:none}

/* ---------- hero ---------- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.hero-date{font-size:1.3rem;font-weight:800}
.hero-sub{color:var(--muted);font-size:.88rem}

/* ---------- task cards ---------- */
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.task-card header{display:flex;align-items:center;gap:10px}
.task-card h3{margin:0;font-size:.98rem;font-weight:700}
.target-chip{margin-inline-start:auto;font-size:.74rem;color:var(--muted);background:var(--surface2);padding:2px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.today-row{display:flex;align-items:baseline;gap:10px;margin-top:14px;flex-wrap:wrap}
.today-hours{font-size:1.55rem;font-weight:800;line-height:1.2}
.today-hours.none{color:var(--muted);font-size:1.1rem;font-weight:600}
.quick{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.week-chip{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:14px;align-items:center;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.week-chip b{color:var(--ink)}
.wc-label{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--surface2);padding:1px 8px;border-radius:999px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px;margin:14px 0 4px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-s);padding:9px 12px}
.s-label{display:block;font-size:.73rem;color:var(--muted);margin-bottom:1px}
.s-value{font-size:1.12rem;font-weight:800;line-height:1.4}
.s-value i{font-style:normal;font-size:.7rem;color:var(--muted);font-weight:500;margin-inline-start:3px}
.progress{height:6px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--task,var(--accent));border-radius:999px}
.card-head{display:flex;align-items:center;gap:10px}
.card-head h3{margin:0;font-size:1rem}
.card-head .badge{margin-inline-start:auto}

/* ---------- chart ---------- */
.plot{position:relative;margin-top:10px}
.bars{display:flex;align-items:flex-end;gap:2px;height:128px}
.bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:2px}
.bar-col.clickable{cursor:pointer}
.bar-col.clickable:hover .bar{filter:brightness(.8)}
.bar{background:var(--task,var(--accent));border-radius:3px 3px 0 0;min-height:2px}
.bar.zero{background:var(--bar-zero)}
.bar-day{height:15px;font-size:.58rem;color:var(--muted);text-align:center;line-height:15px}
.plot-line{position:absolute;left:0;right:0;pointer-events:none}
.plot-line.mean{border-top:2px solid var(--line-mean)}
.plot-line.target{border-top:2px dashed var(--line-target)}
.legend{display:flex;gap:18px;font-size:.74rem;color:var(--muted);margin-top:8px}
.legend i{width:16px;border-top:2px solid;display:inline-block;margin-inline-end:5px;vertical-align:middle}
.lg-mean i{border-color:var(--line-mean)}
.lg-target i{border-style:dashed;border-color:var(--line-target)}
.chart-empty{color:var(--muted);font-size:.85rem;padding:18px 0;text-align:center}
.rule-hint{font-size:.78rem;color:var(--muted);margin-top:10px}
.rule-hint b{font-weight:700}
.rule-hint b.c-ok{color:var(--ok)}
.rule-hint b.c-warn{color:var(--warn)}
.rule-hint b.c-muted{color:var(--muted)}

/* ---------- month view ---------- */
.month-nav{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.month-title h2{margin:0;font-size:1.15rem}
.month-sub{font-size:.78rem;color:var(--muted)}
.month-nav .spacer{margin-inline-start:auto}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- lists ---------- */
.task-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.task-row:last-child{border-bottom:0;padding-bottom:2px}
.task-row:first-child{padding-top:2px}
.task-row .t-name{font-weight:700}
.task-row .t-meta{font-size:.78rem;color:var(--muted)}
.task-row .t-actions{margin-inline-start:auto;display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.card.danger-zone{border-color:#f2c4c4}
.card h4{margin:0 0 6px;font-size:.95rem}
.card p.desc{font-size:.82rem;color:var(--muted);margin:0 0 14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.guide ol{margin:8px 0 0;padding-inline-start:20px;font-size:.85rem}
.guide li{margin-bottom:6px}
.guide .formula{background:var(--accent-soft);color:var(--accent);font-weight:800;border-radius:8px;padding:6px 14px;display:inline-block;margin:6px 0;font-size:.95rem}

/* ---------- empty state ---------- */
.empty-state{text-align:center;padding:52px 24px}
.empty-state h2{margin:0 0 6px;font-size:1.2rem}
.empty-state p{max-width:48ch;margin:6px auto 20px;color:var(--muted);font-size:.9rem}
.empty-state .btn{margin:3px}

/* ---------- forms & modal ---------- */
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600;margin-bottom:14px}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.jalali-hint{font-size:.78rem;color:var(--muted);margin:-8px 0 12px;min-height:1.2em}
.overlay{position:fixed;inset:0;background:rgba(15,18,34,.45);display:grid;place-items:center;padding:20px;z-index:50;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(16,24,40,.28);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 18px;font-size:1.05rem}
.modal-actions{display:flex;gap:8px;margin-top:6px}
.modal-actions .primary{margin-inline-start:auto}
.swatches{display:flex;gap:9px;margin-bottom:16px}
.swatch{width:28px;height:28px;border-radius:50%;background:var(--c);cursor:pointer;position:relative;margin:0}
.swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;width:100%;height:100%}
.swatch:has(input:checked){outline:2px solid var(--ink);outline-offset:2px}
.welcome ol{padding-inline-start:20px;font-size:.9rem}
.welcome li{margin-bottom:4px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%) translateY(16px);background:var(--toast-bg);color:#fff;padding:10px 20px;border-radius:12px;font-size:.86rem;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}

/* ---------- segmented controls & period bar ---------- */
.seg{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-size:.8rem;padding:4px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.seg button.active{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.period-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.period-bar .grow{margin-inline-start:auto}
.custom-dates{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.custom-dates label{margin-bottom:0;font-size:.78rem;gap:4px}
.custom-dates input{padding:7px 10px;font-size:.85rem;width:150px}

/* ---------- line chart ---------- */
.linechart{width:100%;height:auto;display:block;margin-top:10px}
.linechart text{font-family:inherit;font-size:10.5px;fill:var(--muted)}
.lc-grid{stroke:var(--line);stroke-width:1}
.lc-axis{stroke:var(--muted);stroke-width:1;opacity:.45}
.lc-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lc-mean{stroke:var(--line-mean);stroke-width:2;fill:none}
.lc-target{stroke:var(--line-target);stroke-width:2;stroke-dasharray:6 4;fill:none}
.lc-dot{cursor:pointer}

/* ---------- daily view ---------- */
.day-task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.day-task:last-child{border-bottom:0;padding-bottom:2px}
.day-task:first-child{padding-top:2px}
.day-task .d-hours{font-size:1.25rem;font-weight:800;min-width:86px}
.day-task .d-hours.none{color:var(--muted);font-size:.95rem;font-weight:600}
.day-task .d-name{font-weight:700}
.day-task .d-meta{font-size:.76rem;color:var(--muted);flex-basis:100%}
.day-task .d-actions{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.mini-chip{font-size:.72rem;padding:2px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.mini-chip.hit{background:var(--ok-soft);color:var(--ok)}
.mini-chip.under{background:var(--warn-soft);color:var(--warn)}
.mini-chip.none{background:var(--muted-soft);color:var(--muted)}

/* ---------- theme button ---------- */
.theme-btn{width:35px;height:35px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:1rem;display:grid;place-items:center;color:var(--ink);flex:none;padding:0}
.theme-btn:hover{filter:brightness(.96)}

@media (max-width:640px){
  .topbar-inner{flex-wrap:wrap}
  .tabs{margin-inline-start:0;width:100%;justify-content:stretch}
  .tabs button{flex:1;text-align:center;padding:6px 8px}
  .quick{margin-inline-start:0;width:100%}
}
</style>
<script>
(function(){try{
var t = localStorage.getItem('mtracker.theme');
if (t !== 'dark' && t !== 'light') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
document.documentElement.dataset.theme = t;
}catch(e){document.documentElement.dataset.theme='light';}})();
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">m</span>
      <span>mTracker<small>سیستم استمرار (SD Method)</small></span>
    </div>
    <nav class="tabs" aria-label="بخش‌ها">
      <button data-action="tab" data-tab="today" class="active">امروز</button>
      <button data-action="tab" data-tab="daily">روزانه</button>
      <button data-action="tab" data-tab="report">گزارش</button>
      <button data-action="tab" data-tab="tasks">تسک‌ها</button>
      <button data-action="tab" data-tab="data">داده‌ها</button>
    </nav>
    <button class="theme-btn" id="theme-btn" data-action="toggle-theme" title="تغییر پوسته روشن/تاریک">☾</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="modal-root"></div>
<input type="file" id="import-file" accept=".csv,.json,text/csv,application/json" hidden>
<noscript><p style="text-align:center;padding:40px">این برنامه به جاوااسکریپت نیاز دارد.</p></noscript>

<script>
'use strict';

/* =====================================================================
   Layer 0 — utilities
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);

const PALETTE = ['#4f46e5', '#0e9384', '#b54708', '#c01048', '#175cd3', '#6941c6', '#079455', '#d92d20'];

const FA_NUM  = new Intl.NumberFormat('fa-IR', { maximumFractionDigits: 2 });
const FA_NUM1 = new Intl.NumberFormat('fa-IR', { maximumFractionDigits: 1 });
const FA_DATE_FULL = new Intl.DateTimeFormat('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
const fmt1  = n => FA_NUM1.format(Math.round(n * 100) / 100);

let toastTimer = null;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function normDigits(s) {
  return String(s ?? '')
    .replace(/[۰-۹]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 1728))
    .replace(/[٠-٩]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 1584))
    .replace(/٫/g, '.');
}
function toNumber(s) {
  const n = parseFloat(normDigits(s).replace(/,/g, '.').replace(/[^0-9.\-]/g, ''));
  return isFinite(n) ? n : NaN;
}

/* ---------- dates (Gregorian ISO storage, Jalali display) ---------- */
function isoOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isoToDate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function localDateOf(isoDateTime) { return isoOf(new Date(isoDateTime)); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function todayIso() { return isoOf(new Date()); }

const J_FMT = new Intl.DateTimeFormat('en-US-u-ca-persian', { year: 'numeric', month: 'numeric', day: 'numeric' });
function toJ(date) {
  const o = {};
  for (const p of J_FMT.formatToParts(date)) o[p.type] = p.value;
  return { jy: +o.year, jm: +o.month, jd: +o.day };
}
const J_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEKDAYS = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const weekdayName = iso => WEEKDAYS[isoToDate(iso).getDay()];

function monthStartOf(date) { return addDays(date, -(toJ(date).jd - 1)); }
function prevMonthStart(ms) { const d = addDays(ms, -1); return addDays(d, -(toJ(d).jd - 1)); }
function nextMonthStart(ms) { const d = addDays(ms, 31); return addDays(d, -(toJ(d).jd - 1)); }
function monthMeta(ms) {
  const last = addDays(nextMonthStart(ms), -1);
  return { startIso: isoOf(ms), endIso: isoOf(last), length: toJ(last).jd };
}
function jLabel(ms) { const { jy, jm } = toJ(ms); return J_MONTHS[jm - 1] + ' ' + FA_NUM.format(jy); }
function jDayLabel(iso) {
  const { jm, jd } = toJ(isoToDate(iso));
  return weekdayName(iso) + ' ' + FA_NUM.format(jd) + ' ' + J_MONTHS[jm - 1];
}
function jShortLabel(iso) {
  const { jm, jd } = toJ(isoToDate(iso));
  return FA_NUM.format(jd) + ' ' + J_MONTHS[jm - 1];
}

/* =====================================================================
   Layer 1 — storage & repository  [SEAM: swap Storage/Repo for
   IndexedDB in phase 3, then a sync API in phase 4]
   ===================================================================== */
const SCHEMA_VERSION = 1;
const DB_KEY = 'mtracker.db.v1';

function migrate(db) {
  if (!db || typeof db !== 'object') return null;
  if (db.schemaVersion !== SCHEMA_VERSION) return db; /* future upgrades branch here */
  return db;
}

const Storage = {
  load() {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (!raw) return null;
      return migrate(JSON.parse(raw));
    } catch (e) {
      console.error('mTracker: corrupted storage', e);
      try { localStorage.setItem('mtracker.corrupt-backup', localStorage.getItem(DB_KEY) || ''); } catch (_) {}
      return null;
    }
  },
  save(db) {
    try { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    catch (e) { toast('ذخیره‌سازی ناموفق بود؛ فضای مرورگر پر است؟'); }
  }
};

let DB = null;
const Repo = {
  init() {
    DB = Storage.load() || { schemaVersion: SCHEMA_VERSION, tasks: [], entries: [], settings: {} };
    if (!Array.isArray(DB.tasks)) DB.tasks = [];
    if (!Array.isArray(DB.entries)) DB.entries = [];
  },
  persist() { Storage.save(DB); },
  tasks: {
    list() { return DB.tasks; },
    active() { return DB.tasks.filter(t => !t.archivedAt); },
    get(id) { return DB.tasks.find(t => t.id === id); },
    create({ name, targetDailyHours = 0, color }) {
      const t = {
        id: uid(), name: String(name).trim(), targetDailyHours: +targetDailyHours || 0,
        color: color || PALETTE[DB.tasks.length % PALETTE.length],
        createdAt: new Date().toISOString(), archivedAt: null
      };
      DB.tasks.push(t); Repo.persist(); return t;
    },
    update(id, patch) { const t = Repo.tasks.get(id); if (t) Object.assign(t, patch); Repo.persist(); return t; },
    remove(id) {
      DB.tasks = DB.tasks.filter(t => t.id !== id);
      DB.entries = DB.entries.filter(e => e.taskId !== id);
      Repo.persist();
    }
  },
  entries: {
    list() { return DB.entries; },
    forTask(taskId) { return DB.entries.filter(e => e.taskId === taskId); },
    find(taskId, date) { return DB.entries.find(e => e.taskId === taskId && e.date === date); },
    byId(id) { return DB.entries.find(e => e.id === id); },
    upsert({ taskId, date, hours, note = '' }) {
      let e = Repo.entries.find(taskId, date);
      if (e) { e.hours = hours; e.note = note; e.updatedAt = new Date().toISOString(); }
      else { e = { id: uid(), taskId, date, hours, note, createdAt: new Date().toISOString() }; DB.entries.push(e); }
      Repo.persist(); return e;
    },
    remove(id) { DB.entries = DB.entries.filter(e => e.id !== id); Repo.persist(); }
  }
};

/* =====================================================================
   Layer 2 — analytics (pure, DOM-free)  [SEAM: lift to TS module]
   Rule: SD < Mean/2  →  consistent
   ===================================================================== */
const EMPTY_RESULT = { status: 'empty', days: [], n: 0, total: 0, mean: 0, sd: 0, cv: 0, sdLimit: 0, activeDays: 0, targetPct: null };

const Analytics = {
  analyze({ startIso, endIso, entries, target = 0 }) {
    const byDate = new Map();
    for (const e of entries) byDate.set(e.date, (byDate.get(e.date) || 0) + e.hours);
    const days = [];
    let d = isoToDate(startIso);
    const end = isoToDate(endIso);
    let guard = 0;
    while (d <= end && guard++ < 500) {
      const iso = isoOf(d);
      days.push({ date: iso, hours: byDate.get(iso) || 0 });
      d = addDays(d, 1);
    }
    const n = days.length;
    if (!n) return { ...EMPTY_RESULT };
    const xs = days.map(x => x.hours);
    const total = xs.reduce((a, b) => a + b, 0);
    const mean = total / n;
    const sd = Math.sqrt(xs.reduce((a, x) => a + (x - mean) * (x - mean), 0) / n);
    const status = total <= 1e-9 ? 'nodata' : (sd < mean / 2 - 1e-9 ? 'ok' : 'volatile');
    return {
      status, days, n, total, mean, sd,
      cv: mean > 0 ? sd / mean : 0,
      sdLimit: mean / 2,
      activeDays: xs.filter(x => x > 1e-9).length,
      targetPct: target > 0 ? (mean / target) * 100 : null
    };
  }
};

function clampHours(h) { return Math.min(24, Math.max(0, Math.round(h * 100) / 100)); }

function periodStartFor(task, monthStartIso) {
  const created = task && task.createdAt ? localDateOf(task.createdAt) : null;
  return (created && created > monthStartIso) ? created : monthStartIso;
}
function taskPeriodAnalysis(task, startIso, endIso) {
  const s = periodStartFor(task, startIso);
  const e = endIso < todayIso() ? endIso : todayIso();
  if (s > e) return { ...EMPTY_RESULT, startIso: s, endIso: e };
  return { ...Analytics.analyze({ startIso: s, endIso: e, entries: Repo.entries.forTask(task.id), target: task.targetDailyHours }), startIso: s, endIso: e };
}
function taskMonthAnalysis(task, ms) {
  const meta = monthMeta(ms);
  return taskPeriodAnalysis(task, meta.startIso, meta.endIso);
}
function taskWeekAnalysis(task) {
  const endIso = todayIso();
  const startIso = periodStartFor(task, isoOf(addDays(new Date(), -6)));
  if (startIso > endIso) return null;
  return Analytics.analyze({ startIso, endIso, entries: Repo.entries.forTask(task.id), target: task.targetDailyHours });
}
function overallPeriodAnalysis(startIso, endIso) {
  const e = endIso < todayIso() ? endIso : todayIso();
  let s = startIso;
  const created = Repo.tasks.active().map(t => t.createdAt ? localDateOf(t.createdAt) : null).filter(Boolean);
  if (created.length) {
    const earliest = created.reduce((a, b) => (a < b ? a : b));
    if (earliest > s) s = earliest;
  }
  if (s > e) return { ...EMPTY_RESULT };
  return Analytics.analyze({ startIso: s, endIso: e, entries: Repo.entries.list(), target: 0 });
}
function overallMonthAnalysis(ms) {
  const meta = monthMeta(ms);
  return overallPeriodAnalysis(meta.startIso, meta.endIso);
}
function streakOf(taskId, endDateIso) {
  const set = new Set(Repo.entries.forTask(taskId).filter(e => e.hours > 0).map(e => e.date));
  let s = 0, d = isoToDate(endDateIso), guard = 0;
  while (set.has(isoOf(d)) && guard++ < 3650) { s++; d = addDays(d, -1); }
  return s;
}
function weekdayMean(endIso, weeks) {
  const byDate = new Map();
  for (const e of Repo.entries.list()) byDate.set(e.date, (byDate.get(e.date) || 0) + e.hours);
  let total = 0, d = isoToDate(endIso);
  for (let i = 0; i < weeks; i++) { total += byDate.get(isoOf(d)) || 0; d = addDays(d, -7); }
  return total / weeks;
}
function overallRollingMean(days, endIso) {
  return Analytics.analyze({ startIso: isoOf(addDays(isoToDate(endIso), -(days - 1))), endIso, entries: Repo.entries.list(), target: 0 }).mean;
}
function resolvePeriod() {
  const p = state.period, t0 = todayIso();
  if (p.kind === 'rolling') {
    const days = p.rollingDays || 30;
    const s = isoOf(addDays(new Date(), -(days - 1)));
    return { startIso: s, endIso: t0, title: FA_NUM.format(days) + ' روز اخیر', sub: 'از ' + jShortLabel(s) + ' تا امروز' };
  }
  if (p.kind === 'custom') {
    let a = p.from || isoOf(addDays(new Date(), -13));
    let b = p.to || t0;
    if (a > b) { const tmp = a; a = b; b = tmp; }
    if (b > t0) b = t0;
    if (a > t0) a = t0;
    if (a > b) a = b;
    return { startIso: a, endIso: b, title: 'بازه دلخواه', sub: 'از ' + jShortLabel(a) + ' تا ' + jShortLabel(b) };
  }
  const ms = p.monthStart ? isoToDate(p.monthStart) : monthStartOf(new Date());
  const meta = monthMeta(ms);
  const nowJ = toJ(new Date()), curJ = toJ(ms);
  const isCurrent = nowJ.jy === curJ.jy && nowJ.jm === curJ.jm;
  const elapsed = isCurrent ? Math.round((isoToDate(t0) - isoToDate(meta.startIso)) / 864e5) + 1 : meta.length;
  return {
    startIso: meta.startIso,
    endIso: meta.endIso < t0 ? meta.endIso : t0,
    isCurrent, elapsed, meta,
    title: jLabel(ms),
    sub: isCurrent ? FA_NUM.format(elapsed) + ' روز از ' + FA_NUM.format(meta.length) + ' روز گذشته' : FA_NUM.format(meta.length) + ' روز'
  };
}

function chartHTML(days, opts = {}) {
  const { mean = 0, target = 0, taskId = null } = opts;
  if (!days.length) return '<div class="chart-empty">داده‌ای برای نمایش نیست</div>';
  const maxV = Math.max(target || 0, ...days.map(d => d.hours), 1) * 1.15;
  const lastJd = toJ(isoToDate(days[days.length - 1].date)).jd;
  const bars = days.map(d => {
    const j = toJ(isoToDate(d.date));
    const h = (d.hours / maxV) * 100;
    const showLabel = j.jd === 1 || j.jd === lastJd || j.jd % 5 === 0;
    const attrs = taskId ? ' class="bar-col clickable" data-action="edit-day" data-task="' + taskId + '" data-date="' + d.date + '"' : ' class="bar-col"';
    return '<div' + attrs + ' title="' + jDayLabel(d.date) + ': ' + fmt1(d.hours) + ' ساعت">' +
      '<div class="bar ' + (d.hours > 0 ? '' : 'zero') + '" style="height:' + h.toFixed(1) + '%"></div>' +
      '<span class="bar-day">' + (showLabel ? FA_NUM.format(j.jd) : '') + '</span>' +
      '</div>';
  }).join('');
  let lines = '';
  if (mean > 0) lines += '<div class="plot-line mean" style="bottom:calc(15px + ' + (mean / maxV * 100).toFixed(1) + '%)" title="میانگین: ' + fmt1(mean) + ' ساعت"></div>';
  if (target > 0) lines += '<div class="plot-line target" style="bottom:calc(15px + ' + (target / maxV * 100).toFixed(1) + '%)" title="هدف روزانه: ' + fmt1(target) + ' ساعت"></div>';
  return '<div class="plot"><div class="bars">' + bars + '</div>' + lines + '</div>' +
    ((mean > 0 || target > 0) ?
      '<div class="legend">' +
      (mean > 0 ? '<span class="lg-mean"><i></i>میانگین ' + fmt1(mean) + '</span>' : '') +
      (target > 0 ? '<span class="lg-target"><i></i>هدف ' + fmt1(target) + '</span>' : '') +
      '</div>' : '');
}

function seriesForTask(task, days) {
  const byDate = new Map();
  for (const e of Repo.entries.forTask(task.id)) byDate.set(e.date, (byDate.get(e.date) || 0) + e.hours);
  const created = task.createdAt ? localDateOf(task.createdAt) : null;
  return days.map(d => (created && d.date < created) ? null : (byDate.get(d.date) || 0));
}
function totalSeries(days) {
  const byDate = new Map();
  for (const e of Repo.entries.list()) byDate.set(e.date, (byDate.get(e.date) || 0) + e.hours);
  return days.map(d => byDate.get(d.date) || 0);
}
function legendHTML(items) {
  if (!items || items.length < 2) return '';
  return '<div class="legend">' + items.map(it => '<span><i style="border-color:' + it.color + '"></i>' + esc(it.name) + '</span>').join('') + '</div>';
}
function lineChartHTML(days, series, opts = {}) {
  const n = days.length;
  if (!n) return '<div class="chart-empty">داده‌ای برای نمایش نیست</div>';
  const { mean = 0, target = 0, clickable = true, h = 190 } = opts;
  const W = 700, padR = 42, padL = 10, padT = 14, padB = 26;
  const H = Math.max(h, 90);
  const plotW = W - padR - padL, plotH = H - padT - padB;
  let maxV = target || 0;
  for (const s of series) for (const v of s.values) if (v != null && v > maxV) maxV = v;
  if (mean > maxV) maxV = mean;
  maxV = Math.max(maxV, 1) * 1.15;
  const X = i => W - padR - (n === 1 ? plotW / 2 : i * (plotW / (n - 1)));
  const Y = v => padT + (1 - v / maxV) * plotH;

  let grid = '';
  for (let k = 0; k <= 4; k++) {
    const v = maxV * k / 4;
    grid += '<line class="lc-grid" x1="' + padL + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(v).toFixed(1) + '"/>' +
      '<text x="' + (W - padR + 6) + '" y="' + (Y(v) + 3.5).toFixed(1) + '">' + fmt1(v) + '</text>';
  }
  const tickEvery = n > 45 ? 14 : n > 20 ? 7 : 5;
  let ticks = '';
  for (let i = 0; i < n; i++) {
    const j = toJ(isoToDate(days[i].date));
    if (!(i === 0 || i === n - 1 || j.jd % tickEvery === 0)) continue;
    if (n === 1 && i !== 0) continue;
    const anchor = i === 0 ? 'end' : (i === n - 1 ? 'start' : 'middle');
    const x = X(i).toFixed(1);
    ticks += '<line class="lc-axis" x1="' + x + '" y1="' + (H - padB) + '" x2="' + x + '" y2="' + (H - padB + 4) + '"/>' +
      '<text x="' + x + '" y="' + (H - 8) + '" text-anchor="' + anchor + '">' + (n > 10 ? FA_NUM.format(j.jd) : jShortLabel(days[i].date)) + '</text>';
  }
  let paths = '';
  for (const s of series) {
    let dPath = '', pen = false;
    for (let i = 0; i < n; i++) {
      const v = s.values[i];
      if (v == null) { pen = false; continue; }
      dPath += (pen ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1);
      pen = true;
    }
    if (dPath) paths += '<path class="lc-line" d="' + dPath + '" style="stroke:' + s.color + '"' + (s.total ? ' stroke-width="2.5"' : '') + '/>';
  }
  let dots = '';
  if (n <= 62) {
    const r = n > 40 ? 2.2 : 3;
    for (const s of series) {
      if (s.total) continue;
      for (let i = 0; i < n; i++) {
        const v = s.values[i];
        if (v == null) continue;
        const cx = X(i).toFixed(1), cy = Y(v).toFixed(1);
        dots += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + s.color + '"' + (clickable && s.taskId ? ' class="lc-dot"' : '') + '><title>' + jDayLabel(days[i].date) + ': ' + fmt1(v) + ' ساعت</title></circle>';
        if (clickable && s.taskId) {
          dots += '<circle cx="' + cx + '" cy="' + cy + '" r="8" fill="transparent" class="lc-dot" data-action="edit-day" data-task="' + s.taskId + '" data-date="' + days[i].date + '"/>';
        }
      }
    }
  }
  let lines = '';
  if (mean > 0) lines += '<line class="lc-mean" x1="' + padL + '" y1="' + Y(mean).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(mean).toFixed(1) + '"><title>میانگین: ' + fmt1(mean) + ' ساعت</title></line>';
  if (target > 0) lines += '<line class="lc-target" x1="' + padL + '" y1="' + Y(target).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(target).toFixed(1) + '"><title>هدف روزانه: ' + fmt1(target) + ' ساعت</title></line>';
  return '<svg class="linechart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + grid + lines + paths + ticks + dots + '</svg>' +
    legendHTML(series.map(s => ({ name: s.name, color: s.color })));
}
function chartBlock(days, opts = {}) {
  if (state.chartType === 'line') {
    return lineChartHTML(days, opts.series || [], { mean: opts.mean || 0, target: opts.target || 0, clickable: opts.clickable !== false });
  }
  return chartHTML(days, opts);
}

      '<button class="btn primary" data-action="open-task">ساخت تسک</button></section>';
  }

  const ov = overallPeriodAnalysis(p.startIso, p.endIso);
  const ovChart = state.chartType === 'line'
    ? lineChartHTML(ov.days,
        [{ name: 'مجموع', color: 'var(--ink)', total: true, values: ov.days.map(d => d.hours) }].concat(
          tasks.map(t => ({ name: t.name, color: t.color, values: seriesForTask(t, ov.days), taskId: t.id }))
        ), { mean: ov.mean, clickable: false })
    : chartHTML(ov.days, { mean: ov.mean });

  html += '<div class="stack">';
  html += '<section class="card"><div class="card-head"><h3>همه تسک‌ها</h3>' + badge(ov.status) + '</div>' +
    '<p class="rule-hint">' + VERDICT_NOTE[ov.status] + '</p>' +
    '<div class="stats">' +
    statBox('مجموع ساعت', fmt1(ov.total), 'ساعت') +
    statBox('میانگین روزانه', fmt1(ov.mean), 'ساعت') +
    statBox('انحراف معیار', fmt1(ov.sd), 'ساعت') +
    statBox('روزهای فعال', FA_NUM.format(ov.activeDays) + ' از ' + FA_NUM.format(ov.n)) +
    '</div>' + ovChart + '</section>';

  for (const t of tasks) {
    const a = taskPeriodAnalysis(t, p.startIso, p.endIso);
    const targetStat = t.targetDailyHours > 0
      ? statBox('میانگین نسبت به هدف', fmt1(a.mean) + ' / ' + fmt1(t.targetDailyHours), 'ساعت',
          '<div class="progress"><i style="width:' + Math.min(100, a.targetPct || 0).toFixed(0) + '%"></i></div>')
      : '';
    const chart = chartBlock(a.days, {
      mean: a.mean, target: t.targetDailyHours, taskId: t.id,
      series: [{ name: t.name, color: t.color, values: a.days.map(d => d.hours), taskId: t.id }]
    });
    html += '<section class="card" style="--task:' + t.color + '">' +
      '<div class="card-head"><span class="dot"></span><h3>' + esc(t.name) + '</h3>' + badge(a.status) + '</div>' +
      '<p class="rule-hint">' + VERDICT_NOTE[a.status] + '</p>' +
      '<div class="stats">' +
      statBox('مجموع ساعت', fmt1(a.total), 'ساعت') +
      statBox('میانگین روزانه', fmt1(a.mean), 'ساعت') +
      statBox('انحراف معیار', fmt1(a.sd), 'ساعت') +
      statBox('حد مجاز نوسان', fmt1(a.sdLimit), 'ساعت') +
      statBox('روزهای فعال', FA_NUM.format(a.activeDays) + ' از ' + FA_NUM.format(a.n)) +
      targetStat +
      '</div>' + chart +
      '<p class="rule-hint">قانون پایداری: انحراف معیار باید <b class="' + (a.status === 'ok' ? 'c-ok' : a.status === 'volatile' ? 'c-warn' : 'c-muted') + '">کمتر از ' + fmt1(a.sdLimit) + ' ساعت</b> باشد.' +
      (state.chartType === 'line' ? ' روی نقاط خط کلیک کن تا ثبت همان روز را ویرایش کنی.' : ' روی میله‌ها کلیک کن تا ثبت همان روز را ویرایش کنی.') + '</p>' +
      '</section>';
  }
  html += '</div>';
  return html;
}

/* ---------- view: تحلیل روزانه ---------- */
function viewDaily() {
  if (!state.day) state.day = todayIso();
  const dIso = state.day;
  const isToday = dIso === todayIso();
  const tasks = Repo.tasks.active();

  let html = '<section class="card month-nav">' +
    '<button class="btn ghost" data-action="day-prev">روز قبل</button>' +
    '<div class="month-title"><h2>' + FA_DATE_FULL.format(isoToDate(dIso)) + '</h2>' +
    '<div class="month-sub">' + (isToday ? 'امروز' : 'انتخاب دستی') + '</div></div>' +
    '<button class="btn ghost" data-action="day-next"' + (isToday ? ' disabled' : '') + '>روز بعد</button>' +
    '<span class="spacer"></span>' +
    '<input type="date" id="day-picker" value="' + dIso + '" max="' + todayIso() + '" style="width:150px;padding:7px 10px;font-size:.85rem">' +
    (isToday ? '' : '<button class="btn small ghost" data-action="day-today">برو به امروز</button>') +
    '</section>';

  if (!tasks.length) {
    return html + '<section class="card empty-state"><h2>تسکی وجود ندارد</h2>' +
      '<p>برای تحلیل روزانه، اول یک تسک بساز.</p>' +
      '<button class="btn primary" data-action="open-task">ساخت تسک</button></section>';
  }

  const dayEntries = Repo.entries.list().filter(e => e.date === dIso);
  const byTask = new Map(dayEntries.map(e => [e.taskId, e]));
  const dayTotal = dayEntries.reduce((a, e) => a + e.hours, 0);
  const targetSum = tasks.reduce((a, t) => a + (t.targetDailyHours || 0), 0);
  const m7 = overallRollingMean(7, dIso);
  const m30 = overallRollingMean(30, dIso);
  const wd = weekdayMean(dIso, 8);
  const delta30 = m30 > 0 ? (dayTotal - m30) / m30 * 100 : null;
  const spark = Analytics.analyze({ startIso: isoOf(addDays(isoToDate(dIso), -13)), endIso: dIso, entries: Repo.entries.list(), target: 0 });

  html += '<div class="stack">';
  html += '<section class="card"><div class="card-head"><h3>جمع روز</h3>' +
    '<span class="mini-chip ' + (dayTotal > 0 ? 'hit' : 'none') + '">' + (dayTotal > 0 ? 'ثبت شده' : 'بدون ثبت') + '</span></div>' +
    '<div class="stats">' +
    statBox('مجموع این روز', fmt1(dayTotal), 'ساعت') +
    statBox('جمع هدف روزانه', targetSum > 0 ? fmt1(targetSum) : 'ندارد', targetSum > 0 ? 'ساعت' : '') +
    statBox('میانگین ۷ روز اخیر', fmt1(m7), 'ساعت') +
    statBox('میانگین ۳۰ روز اخیر', fmt1(m30), 'ساعت') +
    statBox('میانگین همین روزِ هفته', fmt1(wd), 'ساعت') +
    statBox('تسک‌های ثبت‌شده', FA_NUM.format(byTask.size) + ' از ' + FA_NUM.format(tasks.length)) +
    '</div>' +
    (delta30 != null ? '<p class="rule-hint">این روز نسبت به میانگین ۳۰ روز اخیر <b class="' + (delta30 >= 0 ? 'c-ok' : 'c-warn') + '">' +
      (delta30 >= 0 ? FA_NUM1.format(delta30) + '٪ بیشتر' : FA_NUM1.format(-delta30) + '٪ کمتر') + '</b> است.</p>' : '') +
    '<p class="rule-hint" style="margin-top:2px">روند ۱۴ روز اخیر (مجموع همه تسک‌ها):</p>' +
    lineChartHTML(spark.days, [{ name: 'مجموع', color: 'var(--ink)', total: true, values: spark.days.map(d => d.hours) }], { h: 120, clickable: false }) +
    '</section>';

  html += '<section class="card"><div class="card-head"><h3>تسک‌ها در این روز</h3></div>';
  for (const t of tasks) {
    const e = byTask.get(t.id);
    const tp = taskPeriodAnalysis(t, isoOf(addDays(isoToDate(dIso), -29)), dIso);
    const st = streakOf(t.id, dIso);
    const chip = e
      ? (t.targetDailyHours > 0
          ? (e.hours >= t.targetDailyHours ? '<span class="mini-chip hit">هدف برآورده</span>' : '<span class="mini-chip under">زیر هدف</span>')
          : '<span class="mini-chip hit">ثبت شده</span>')
      : '<span class="mini-chip none">ثبت نشده</span>';
    html += '<div class="day-task">' +
      '<span class="dot" style="--task:' + t.color + '"></span>' +
      '<div class="d-hours' + (e ? '' : ' none') + '">' + (e ? fmt1(e.hours) + ' ساعت' : 'ثبت نشده') + '</div>' +
      '<div><div class="d-name">' + esc(t.name) + '</div>' +
      '<div class="d-meta">' +
      (t.targetDailyHours > 0 ? 'هدف: ' + fmt1(t.targetDailyHours) + ' ساعت | ' : '') +
      'میانگین ۳۰ روزه: ' + fmt1(tp.mean) + ' | ' +
      (st > 0 ? 'زنجیره: ' + FA_NUM.format(st) + ' روز' : 'بدون زنجیره') +
      (e && e.note ? ' | یادداشت: ' + esc(e.note) : '') +
      '</div></div>' +
      chip +
      '<div class="d-actions">' +
      '<button class="btn small" data-action="quick-add" data-task="' + t.id + '" data-date="' + dIso + '" data-amount="0.5">+۳۰ دقیقه</button>' +
      '<button class="btn small" data-action="quick-add" data-task="' + t.id + '" data-date="' + dIso + '" data-amount="1">+۱ ساعت</button>' +
      '<button class="btn small ghost" data-action="open-entry" data-task="' + t.id + '" data-date="' + dIso + '">ویرایش</button>' +
      '</div></div>';
  }
  html += '</section></div>';
  return html;
}

/* =====================================================================
   Layer 4 — data transfer (CSV / JSON)
   ===================================================================== */
function download(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csvEscape(v) {
  v = String(v ?? '');
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function exportCSV() {
  const rows = [['date', 'task', 'hours', 'note']];
  const tmap = new Map(Repo.tasks.list().map(t => [t.id, t.name]));
  const entries = [...Repo.entries.list()].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  for (const e of entries) rows.push([e.date, tmap.get(e.taskId) || '', e.hours, e.note || '']);
  download('mtracker-entries-' + todayIso() + '.csv', '\uFEFF' + rows.map(r => r.map(csvEscape).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  toast(FA_NUM.format(entries.length) + ' ثبت خروجی گرفته شد');
}
function exportJSON() {
  download('mtracker-backup-' + todayIso() + '.json', JSON.stringify(DB, null, 2), 'application/json');
  toast('بکاپ کامل دانلود شد');
}
function parseCSV(text) {
  const t = String(text).replace(/^\uFEFF/, '');
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inQ) {
      if (c === '"') { if (t[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length && !(r.length === 1 && r[0].trim() === ''));
}
function normalizeDate(s) {
  s = normDigits(s).trim().replace(/[\/.]/g, '-');
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return null;
  const y = +m[1], mo = +m[2], da = +m[3];
  if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
  const d = new Date(y, mo - 1, da);
  if (d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== da) return null;
  return isoOf(d);
}
function importCSVText(text) {
  const rows = parseCSV(text);
  if (!rows.length) { toast('فایل خالی است'); return; }
  const header = rows[0].map(h => normDigits(h).trim().toLowerCase());
  const hasHeader = header.includes('date') && header.includes('task') && header.includes('hours');
  const idx = hasHeader
    ? { d: header.indexOf('date'), t: header.indexOf('task'), h: header.indexOf('hours'), n: header.indexOf('note') }
    : { d: 0, t: 1, h: 2, n: 3 };
  const body = hasHeader ? rows.slice(1) : rows;
  let created = 0, added = 0, skipped = 0;
  const cache = new Map();
  for (const r of body) {
    if (!r || r.length < 3) { skipped++; continue; }
    const date = normalizeDate(r[idx.d] || '');
    const tname = (r[idx.t] || '').trim();
    const hours = toNumber(r[idx.h]);
    if (!date || !tname || !(hours > 0 && hours <= 24)) { skipped++; continue; }
    let t = cache.get(tname);
    if (!t) {
      t = DB.tasks.find(x => x.name === tname);
      if (!t) { t = Repo.tasks.create({ name: tname, targetDailyHours: 0 }); created++; }
      cache.set(tname, t);
    }
    Repo.entries.upsert({ taskId: t.id, date, hours: clampHours(hours), note: idx.n >= 0 ? (r[idx.n] || '').trim() : '' });
    added++;
  }
  toast(FA_NUM.format(added) + ' ثبت اضافه شد، ' + FA_NUM.format(created) + ' تسک جدید، ' + FA_NUM.format(skipped) + ' رد نامعتبر');
  closeModal(); render();
}
function importJSONText(text) {
  try {
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.entries)) throw new Error('bad shape');
    const migrated = migrate(data);
    if (!migrated) throw new Error('bad version');
    DB = migrated;
    if (!Array.isArray(DB.tasks) || !Array.isArray(DB.entries)) throw new Error('bad arrays');
    Repo.persist();
    toast('بازیابی شد: ' + FA_NUM.format(DB.tasks.length) + ' تسک، ' + FA_NUM.format(DB.entries.length) + ' ثبت');
    closeModal(); render();
  } catch (e) { toast('فایل بکاپ معتبر نیست'); }
}

function loadSample() {
  const start = addDays(new Date(), -34);
  const startIso = isoOf(start);
  const t1 = Repo.tasks.create({ name: 'زبان انگلیسی', targetDailyHours: 2, color: PALETTE[0] });
  const t2 = Repo.tasks.create({ name: 'برنامه‌نویسی', targetDailyHours: 3, color: PALETTE[1] });
  const t3 = Repo.tasks.create({ name: 'ورزش', targetDailyHours: 1, color: PALETTE[4] });
  for (const t of [t1, t2, t3]) t.createdAt = new Date(start.getFullYear(), start.getMonth(), start.getDate(), 12).toISOString();
  let seed = 42;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const end = new Date();
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const iso = isoOf(d);
    if (rnd() > 0.12) Repo.entries.upsert({ taskId: t1.id, date: iso, hours: clampHours(2 + (rnd() - 0.5) * 0.8) });
    if (rnd() > 0.55) Repo.entries.upsert({ taskId: t2.id, date: iso, hours: clampHours(4.5 + rnd() * 2.5) });
    if (rnd() > 0.2) Repo.entries.upsert({ taskId: t3.id, date: iso, hours: clampHours(0.9 + (rnd() - 0.5) * 0.3) });
  }
  Repo.persist();
  state.period.monthStart = null;
  state.day = null;
  toast('داده نمونه بارگذاری شد');
  closeModal(); render();
}

/* =====================================================================
   Layer 5 — events
   ===================================================================== */
function armButton(btn, armedLabel) {
  btn.dataset.armed = '1';
  btn.dataset.orig = btn.textContent;
  btn.textContent = armedLabel;
  btn.classList.add('danger');
  setTimeout(() => {
    if (!document.body.contains(btn)) return;
    btn.dataset.armed = '0';
    btn.textContent = btn.dataset.orig;
    btn.classList.remove('danger');
  }, 3500);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const d = el.dataset;

  if (a === 'overlay-close') { if (e.target === el) closeModal(); return; }
  if (a === 'close-modal') { closeModal(); return; }

  switch (a) {
    case 'tab':
      state.tab = d.tab;
      render();
      window.scrollTo({ top: 0 });
      break;

    case 'month-prev':
      state.period.monthStart = isoOf(prevMonthStart(isoToDate(state.period.monthStart || isoOf(monthStartOf(new Date())))));
      render();
      break;
    case 'month-next':
      state.period.monthStart = isoOf(nextMonthStart(isoToDate(state.period.monthStart)));
      render();
      break;

    case 'set-period':
      state.period.kind = d.kind;
      if (d.kind === 'custom' && !state.period.from) {
        state.period.from = isoOf(addDays(new Date(), -13));
        state.period.to = todayIso();
      }
      render();
      break;
    case 'set-rolling':
      state.period.rollingDays = +d.days || 30;
      render();
      break;
    case 'set-chart':
      state.chartType = d.chart === 'line' ? 'line' : 'bar';
      render();
      break;

    case 'day-prev':
      state.day = isoOf(addDays(isoToDate(state.day || todayIso()), -1));
      render();
      break;
    case 'day-next':
      if ((state.day || todayIso()) >= todayIso()) break;
      state.day = isoOf(addDays(isoToDate(state.day), 1));
      render();
      break;
    case 'day-today':
      state.day = todayIso();
      render();
      break;

    case 'toggle-theme': {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('mtracker.theme', next); } catch (_) {}
      const tb = $('#theme-btn');
      if (tb) tb.textContent = next === 'dark' ? '☀' : '☾';
      break;
    }

    case 'open-entry':
      openEntryModal({ taskId: d.task || null, date: d.date || null });
      break;
    case 'edit-day':
      openEntryModal({ taskId: d.task, date: d.date });
      break;
    case 'quick-add': {
      const t = Repo.tasks.get(d.task);
      if (!t) break;
      const date = d.date || todayIso();
      if (date > todayIso()) break;
      const cur = Repo.entries.find(t.id, date);
      const next = clampHours((cur ? cur.hours : 0) + parseFloat(d.amount));
      if (next <= 0) break;
      Repo.entries.upsert({ taskId: t.id, date, hours: next, note: cur ? cur.note : '' });
      render();
      break;
    }
    case 'delete-entry': {
      const entry = Repo.entries.byId(d.entry);
      if (!entry) break;
      Repo.entries.remove(entry.id);
      toast('ثبت حذف شد');
      closeModal(); render();
      break;
    }

    case 'open-task':
      openTaskModal(d.task || null);
      break;
    case 'delete-task': {
      const t = Repo.tasks.get(d.task);
      if (!t) break;
      if (el.dataset.armed !== '1') { armButton(el, 'مطمئنی؟ حذف'); break; }
      Repo.tasks.remove(t.id);
      toast('تسک «' + t.name + '» و همه ثبت‌هایش حذف شد');
      render();
      break;
    }

    case 'export-csv': exportCSV(); break;
    case 'export-json': exportJSON(); break;
    case 'import-click': $('#import-file').click(); break;

    case 'load-sample': {
      if (Repo.tasks.list().length > 0 && el.dataset.armed !== '1') { armButton(el, 'داده فعلی ترکیب می‌شود، ادامه؟'); break; }
      loadSample();
      break;
    }
    case 'reset-all':
      if (el.dataset.armed !== '1') { armButton(el, 'مطمئنی؟ همه پاک شود'); break; }
      DB = { schemaVersion: SCHEMA_VERSION, tasks: [], entries: [], settings: {} };
      Repo.persist();
      state.period.monthStart = null;
      state.day = null;
      state.period.kind = 'month';
      toast('همه داده‌ها پاک شد');
      render();
      break;
  }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();

  if (form.dataset.form === 'entry') {
    const entryId = form.dataset.entryId || null;
    const entry = entryId ? Repo.entries.byId(entryId) : null;
    const taskId = entry ? entry.taskId : form.elements.task.value;
    const date = form.elements.date.value;
    const hours = toNumber(form.elements.hours.value);
    const note = form.elements.note.value.trim();
    if (!date) { toast('تاریخ را انتخاب کن'); return; }
    if (!(hours > 0 && hours <= 24)) { toast('ساعت باید بیشتر از صفر و حداکثر ۲۴ باشد'); return; }
    const task = Repo.tasks.get(taskId);
    if (!task) { toast('تسک پیدا نشد'); return; }
    const existing = Repo.entries.find(taskId, date);
    Repo.entries.upsert({ taskId, date, hours: clampHours(hours), note });
    toast(existing ? 'ثبت به‌روزرسانی شد' : 'ثبت شد');
    closeModal(); render();
    return;
  }

  if (form.dataset.form === 'task') {
    const id = form.dataset.taskId || null;
    const name = form.elements.name.value.trim();
    if (!name) { toast('نام تسک را بنویس'); return; }
    const target = Math.max(0, Math.min(24, toNumber(form.elements.target.value) || 0));
    const colorEl = form.querySelector('input[name="color"]:checked');
    const color = colorEl ? colorEl.value : undefined;
    if (id) {
      Repo.tasks.update(id, { name, targetDailyHours: target, ...(color ? { color } : {}) });
      toast('تسک به‌روزرسانی شد');
    } else {
      Repo.tasks.create({ name, targetDailyHours: target, color });
      toast('تسک «' + name + '» ساخته شد');
    }
    closeModal(); render();
  }
});

document.addEventListener('change', e => {
  if (e.target && (e.target.id === 'p-from' || e.target.id === 'p-to')) {
    state.period[e.target.id === 'p-from' ? 'from' : 'to'] = e.target.value || null;
    render();
    return;
  }
  if (e.target && e.target.id === 'day-picker') {
    if (e.target.value) state.day = e.target.value;
    render();
    return;
  }
  if (e.target && e.target.id === 'import-file') {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const txt = String(reader.result || '');
      if (f.name.toLowerCase().endsWith('.json')) importJSONText(txt);
      else importCSVText(txt);
    };
    reader.readAsText(f, 'utf-8');
    e.target.value = '';
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* =====================================================================
   init
   ===================================================================== */
Repo.init();
render();
if (!DB.tasks.length && !DB.entries.length && !localStorage.getItem('mtracker.welcomed')) {
  localStorage.setItem('mtracker.welcomed', '1');
  openModal('<div class="welcome">' +
    '<h3>به mTracker خوش آمدی</h3>' +
    '<p style="font-size:.9rem;color:var(--muted)">این برنامه بر پایه روش «پایداری» کار می‌کند: مهم نیست یک روز چقدر کار کنی، مهم این است که هر روز کمی کار کنی.</p>' +
    '<ol>' +
    '<li>یک تسک بساز و هدف روزانه‌اش را مشخص کن</li>' +
    '<li>هر روز ساعت کارکردت را ثبت کن</li>' +
    '<li>در گزارش ماهانه چک کن: انحراف معیارت باید کمتر از نصف میانگینت باشد</li>' +
    '</ol>' +
    '<div class="modal-actions">' +
    '<button class="btn ghost" data-action="load-sample">دیدن با داده نمونه</button>' +
    '<button class="btn primary" data-action="open-task">شروع با اولین تسک</button>' +
    '</div></div>');
}
</script>
</body>
